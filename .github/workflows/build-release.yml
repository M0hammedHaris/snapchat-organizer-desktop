name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0-alpha
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate app icons
      run: python scripts/create_icon.py
        
    - name: Build with PyInstaller
      run: |
        pyinstaller snapchat-organizer.spec --clean --noconfirm
        
    - name: Create DMG
      run: |
        # Create temporary directory for DMG contents
        mkdir -p dist/dmg
        cp -R "dist/Snapchat Organizer.app" dist/dmg/
        
        # Create symbolic link to Applications folder
        ln -s /Applications dist/dmg/Applications
        
        # Create DMG
        hdiutil create -volname "Snapchat Organizer" \
                       -srcfolder dist/dmg \
                       -ov -format UDZO \
                       "dist/Snapchat-Organizer-macOS.dmg"
        
        rm -rf dist/dmg
        
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          dist/Snapchat Organizer.app
          dist/Snapchat-Organizer-macOS.dmg
        retention-days: 90
        
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install PyInstaller
      run: |
        pip install pyinstaller>=6.0.0

    - name: Generate app icons
      run: python scripts/create_icon.py

    - name: Build with PyInstaller
      run: |
        pyinstaller snapchat-organizer.spec --clean --noconfirm

    - name: Verify build output
      run: |
        Write-Host "Build output contents:"
        Get-ChildItem -Path dist -Recurse | Select-Object FullName
        # Verify python311.dll exists in the output
        $pythonDll = Get-ChildItem -Path dist -Recurse -Filter "python3*.dll" | Select-Object -First 1
        if ($pythonDll) {
          Write-Host "Found Python DLL: $($pythonDll.FullName)"
        } else {
          Write-Host "WARNING: python3*.dll not found in build output!"
        }

    - name: Create ZIP
      run: |
        Compress-Archive -Path "dist\SnapchatOrganizer\*" -DestinationPath "dist\Snapchat-Organizer-Windows.zip"
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: dist/Snapchat-Organizer-Windows.zip
        retention-days: 90
        
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate app icons
      run: python scripts/create_icon.py
        
    - name: Build with PyInstaller
      run: |
        pyinstaller snapchat-organizer.spec --clean --noconfirm
        
    - name: Create tarball
      run: |
        cd dist
        tar -czf Snapchat-Organizer-Linux.tar.gz "Snapchat Organizer"
        
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: dist/Snapchat-Organizer-Linux.tar.gz
        retention-days: 90
        
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # macOS DMG
        find artifacts/macos-build -name "*.dmg" -exec cp {} release-assets/ \; || true
        
        # Windows ZIP
        find artifacts/windows-build -name "*.zip" -exec cp {} release-assets/ \; || true
        
        # Linux tarball
        find artifacts/linux-build -name "*.tar.gz" -exec cp {} release-assets/ \; || true
        
        ls -lh release-assets/
        
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Build Release Notes
      id: release_notes
      run: |
        # Use the checked-in beta release notes as the base
        cp docs/releases/beta/BETA_RELEASE_NOTES.md release-notes.md
        
        # Append auto-generated changelog footer
        echo "" >> release-notes.md
        echo "---" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Changes in this release" >> release-notes.md
        echo "" >> release-notes.md
        # Get commits since the previous tag (falls back to all commits if first tag)
        PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -n1)
        if [ -n "$PREV_TAG" ]; then
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.get_version.outputs.VERSION }}" >> release-notes.md
          echo "" >> release-notes.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release-notes.md
        else
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/v${{ steps.get_version.outputs.VERSION }}" >> release-notes.md
          echo "" >> release-notes.md
          git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release-notes.md
        fi
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ steps.get_version.outputs.VERSION }}
        body_path: release-notes.md
        draft: false
        prerelease: true
        generate_release_notes: true
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
