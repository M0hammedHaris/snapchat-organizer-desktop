name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0-alpha
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate app icons
      run: python scripts/create_icon.py
        
    - name: Build with PyInstaller
      run: |
        pyinstaller snapchat-organizer.spec --clean --noconfirm
        
    - name: Create DMG
      run: |
        # Create temporary directory for DMG contents
        mkdir -p dist/dmg
        cp -R "dist/Snapchat Organizer.app" dist/dmg/
        
        # Create symbolic link to Applications folder
        ln -s /Applications dist/dmg/Applications
        
        # Create DMG
        hdiutil create -volname "Snapchat Organizer" \
                       -srcfolder dist/dmg \
                       -ov -format UDZO \
                       "dist/Snapchat-Organizer-macOS.dmg"
        
        rm -rf dist/dmg
        
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          dist/Snapchat Organizer.app
          dist/Snapchat-Organizer-macOS.dmg
        retention-days: 90
        
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install PyInstaller
      run: |
        pip install pyinstaller>=6.0.0

    - name: Generate app icons
      run: python scripts/create_icon.py

    - name: Build with PyInstaller
      run: |
        pyinstaller snapchat-organizer.spec --clean --noconfirm

    - name: Verify build output
      run: |
        Write-Host "Build output contents:"
        Get-ChildItem -Path dist -Recurse | Select-Object FullName
        # Verify python311.dll exists in the output
        $pythonDll = Get-ChildItem -Path dist -Recurse -Filter "python3*.dll" | Select-Object -First 1
        if ($pythonDll) {
          Write-Host "Found Python DLL: $($pythonDll.FullName)"
        } else {
          Write-Host "WARNING: python3*.dll not found in build output!"
        }

    - name: Create ZIP
      run: |
        Compress-Archive -Path "dist\SnapchatOrganizer\*" -DestinationPath "dist\Snapchat-Organizer-Windows.zip"
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: dist/Snapchat-Organizer-Windows.zip
        retention-days: 90
        
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate app icons
      run: python scripts/create_icon.py
        
    - name: Build with PyInstaller
      run: |
        pyinstaller snapchat-organizer.spec --clean --noconfirm
        
    - name: Create tarball
      run: |
        cd dist
        tar -czf Snapchat-Organizer-Linux.tar.gz "Snapchat Organizer"
        
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: dist/Snapchat-Organizer-Linux.tar.gz
        retention-days: 90
        
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # macOS DMG
        find artifacts/macos-build -name "*.dmg" -exec cp {} release-assets/ \; || true
        
        # Windows ZIP
        find artifacts/windows-build -name "*.zip" -exec cp {} release-assets/ \; || true
        
        # Linux tarball
        find artifacts/linux-build -name "*.tar.gz" -exec cp {} release-assets/ \; || true
        
        ls -lh release-assets/
        
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Create Release Notes
      id: release_notes
      run: |
        cat > release-notes.md << 'EOF'
        # Snapchat Organizer Desktop ${{ steps.get_version.outputs.VERSION }}
        
        ## Beta Release - Wider Testing Phase
        
        Thank you for testing Snapchat Organizer Desktop! This beta release builds on
        months of alpha testing feedback with a subscription-based licensing system,
        new onboarding experience, dynamic theming, and crash reporting.
        
        ### What's New in Beta
        
        - **Subscription Licensing**: Free / Pro / Premium tiers with Stripe integration
        - **Onboarding Carousel**: Guided first-run experience for new users
        - **Dynamic Light/Dark Theme**: Auto-detects your system theme and switches in real-time
        - **Crash Reporting (Sentry)**: Automatic error reporting for faster bug fixes
        - **Improved Stability**: Dozens of bug fixes from alpha testing
        
        ### ✨ Features
        
        - **Download Tab**: Download Snapchat memories from HTML exports
        - **Organize Tab**: Organize chat media by person with intelligent 3-tier matching
        - **Tools Tab**: 6 utility tools for media management
          - Verify file integrity
          - Remove duplicates
          - Organize by year
          - Fix timestamps
          - Convert timezones (coming soon)
          - Apply overlays (coming soon)
        - **Settings**: Customize paths, behavior, and processing options
        - **Help System**: Step-by-step Snapchat data download guide (F1)
        - **License Management**: Login/register, view tier, manage devices
        
        ### 📦 Downloads
        
        - **macOS**: `Snapchat-Organizer-macOS.dmg` (macOS 10.13+)
          - **First run**: Right-click the app → Open (security warning is normal)
          - See [macOS Installation Guide](docs/releases/beta/MACOS_INSTALLATION_BETA.md)
        - **Windows**: `Snapchat-Organizer-Windows.zip` (Windows 10/11)
          - **First run**: Click "More info" → "Run anyway" when SmartScreen appears
          - See [Windows Installation Guide](docs/releases/beta/WINDOWS_INSTALLATION_BETA.md)
        - **Linux**: `Snapchat-Organizer-Linux.tar.gz` (Ubuntu 20.04+)
        
        ### 📋 Requirements
        
        - No Python installation required (standalone builds)
        - Snapchat data export (see Help menu in app, or press F1)
        
        ### 🛡️ Security Warnings (Expected & Safe!)
        
        **macOS Users:** You may see "unidentified developer" warning
        - **Why:** App is not yet notarized (planned for production release)
        - **Safe to bypass:** Right-click app → Open → Click "Open"
        - **One-time only:** After first launch, opens normally
        
        **Windows Users:** You may see SmartScreen "Windows protected your PC" warning
        - **Why:** App is not yet code-signed (planned for production release)
        - **Safe to bypass:** Click "More info" → Click "Run anyway"
        - **One-time only:** After first launch, opens normally
        
        ### 📝 Testing Instructions
        
        1. Download the appropriate file for your OS
        2. Extract/mount and run the application
        3. **Bypass security warning if prompted** (one-time only, safe)
        4. Complete the onboarding carousel
        5. Register or skip to use the Free tier
        6. Press F1 for help or see the Help menu
        7. Follow the testing guide in `docs/releases/beta/BETA_TESTING_GUIDE.md`
        
        ### 🐛 Known Limitations
        
        - First launch may be slow (normal for PyInstaller apps)
        - Timezone conversion and overlay compositing tools are placeholders
        - Code signing planned for production release
        
        ### 🙏 Feedback
        
        Please report bugs and suggestions:
        - GitHub Issues: [Create Issue](https://github.com/M0hammedHaris/snapchat-organizer-desktop/issues/new)
        
        ---
        
        **Full Changelog**: https://github.com/M0hammedHaris/snapchat-organizer-desktop/compare/v${{ steps.get_version.outputs.VERSION }}
        EOF
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ steps.get_version.outputs.VERSION }}
        body_path: release-notes.md
        draft: false
        prerelease: true
        generate_release_notes: true
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
